version: 2

updates:
  # Actions are pinned to commit SHAs, which never move on their own — without
  # this they silently go stale, including past security advisories. Dependabot
  # rewrites both the pin and the `# vX.Y.Z` comment next to it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns: ["*"]

  # Without this, runtime and dev dependencies only move when someone bumps
  # them by hand, so they drift past security advisories. Minor and patch
  # bumps share one weekly PR; each major still gets its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
