pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,mjs,json,md,yml,yaml}"
      exclude: "docs/**"
      run: pnpm exec oxfmt --check {staged_files}
      fail_text: "Run 'pnpm format' to fix formatting."
    lint:
      glob: "*.{ts,tsx,js,mjs,mts,cts}"
      run: pnpm exec oxlint {staged_files}
      fail_text: "Run 'pnpm lint' to fix lint errors."

# fallow audits the whole branch against main and takes minutes, so it runs
# once per push rather than on every checkpoint commit.
pre-push:
  commands:
    fallow:
      run: pnpm exec fallow audit --base origin/main --format compact
      fail_text: "Fallow found issues in your changes. Run 'pnpm fallow' to see details."
