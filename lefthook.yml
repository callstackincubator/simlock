pre-commit:
  parallel: true
  commands:
    # Formats what is staged and stages the result, so nobody runs a formatter by hand.
    format:
      glob: "*.{ts,tsx,js,mjs,json,md,yml,yaml}"
      # website/ is its own package and oxfmt skips it, so a commit with only website/ files would
      # hand oxfmt nothing and fail.
      exclude:
        - "docs/**"
        - "website/**"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,mjs,mts,cts}"
      run: pnpm exec oxlint {staged_files}
      fail_text: "Run 'pnpm lint' to fix lint errors."
    # Which file may import which path is a whole-graph question, so this checks every import; it takes seconds.
    boundaries:
      glob: "*.{ts,tsx,js,mjs,mts,cts,json}"
      run: pnpm exec depcruise src e2e ui --ignore-known
      fail_text: "An import crosses a component's index or a direction rule (architecture rule 14, ADR 0027)."
    # A comment the commit adds or edits starts with "why:" or goes (architecture rule 17).
    comments:
      glob: "*.{ts,tsx,js,mjs,mts,cts,sh}"
      run: node .agents/scripts/comment-lint.mjs --base HEAD {staged_files}
      fail_text: "Delete the comment, or start it with 'why:' when it says why the code does something unexpected."
    # A change can break the files that call it, so this checks the whole project; it takes seconds.
    typecheck:
      glob: "*.{ts,tsx,mts,cts}"
      run: pnpm run typecheck

# These audit the whole branch against main, so they run once per push rather than on every
# checkpoint commit.
pre-push:
  piped: true
  commands:
    fallow:
      priority: 1
      run: pnpm exec fallow audit --base origin/main --format compact
      fail_text: "Fallow found issues in your changes. Run 'pnpm fallow' to see details."
    protocol-bump:
      priority: 1
      run: node .agents/scripts/protocol-bump-check.mjs --base origin/main
      fail_text: "A contract shape change and a PROTOCOL_VERSION_RANGE bump go together (toolchain.md, Contract shapes)."
    typecheck-e2e:
      priority: 2
      run: pnpm run typecheck:e2e:types
